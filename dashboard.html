<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BGHQ Point Table</title>
    <meta name="description" content="BGHQ Dashboard — Create and download professional Free Fire point tables.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="index.css">
    <!-- html2canvas for PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="bghq-loader">
        <div class="loader-ring"></div>
        <div class="loader-text">BGHQ LOADING</div>
    </div>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">BGHQ</div>
        <div class="nav-right">
            <!-- Profile Dropdown -->
            <div class="profile-dropdown-wrap" id="profileWrap">
                <div class="profile-icon" id="profileBtn" title="Profile" tabindex="0">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="profile-info-name" id="ddUsername">Loading…</div>
                    <div class="profile-info-tier" id="ddTier">Subscription: <strong id="ddSubType">—</strong></div>
                    <div class="profile-days" id="ddDays">— Days Left</div>
                    <button class="btn btn-blue" id="logoutBtn" style="width:100%; padding:7px; font-size:10px;">LOGOUT</button>
                </div>
            </div>
            <button id="themeToggleBtn" class="theme-toggle" title="Switch to Light Mode">🌙</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- ═══════════════ LEFT SIDEBAR ═══════════════ -->
        <aside class="sidebar">
            <div class="sidebar-logo">BGHQ</div>

            <!-- Import Image -->
            <div class="sidebar-block">
                <span class="label-small">Assets</span>
                <div class="dropdown" id="importDropdown">
                    <button class="btn btn-blue" style="width:100%; font-size:10px; padding:8px;" id="importToggleBtn">⊕ IMPORT IMAGE</button>
                    <div class="dropdown-content">
                        <div class="dropdown-item" id="localImportBtn">📁 Local File</div>
                        <div class="dropdown-item" id="driveToggleBtn">☁️ Google Drive Link</div>
                    </div>
                </div>
                <input type="file" id="fileInput" style="display:none;" accept="image/*" multiple>
                <div class="drive-input-wrap" id="driveInputWrap">
                    <input type="url" id="driveUrl" placeholder="Paste Google Drive share link…">
                    <button class="btn btn-blue" style="font-size:10px; padding:6px;" id="driveFetchBtn">FETCH IMAGE</button>
                </div>
            </div>

            <!-- Asset Thumbnails -->
            <div class="sidebar-block">
                <span class="label-small">Preview / Place</span>
                <div class="asset-preview" id="assetPreview">
                    <!-- Thumbs injected by JS -->
                </div>
            </div>

            <!-- Macro -->
            <div class="sidebar-block">
                <span class="label-small">Macro</span>
                <button class="btn btn-green" style="width:100%; font-size:10px; padding:8px; margin-bottom:5px;" onclick="saveMacro()">💾 CREATE / REPLACE</button>
                <button class="btn btn-blue"  style="width:100%; font-size:10px; padding:8px;" onclick="applyMacro()">▶ APPLY MACRO</button>
            </div>

            <!-- Download -->
            <div style="margin-top:auto;">
                <button class="btn btn-pink" id="downloadBtn" style="width:100%; border:2px solid var(--neon-pink); color:var(--neon-pink); box-shadow:0 0 12px var(--neon-pink);">⬇ DOWNLOAD PNG</button>
            </div>
        </aside>

        <!-- ═══════════════ CENTER CANVAS ═══════════════ -->
        <main class="main-canvas-area" id="canvasArea">
            <div class="point-table-template" id="mainTableTemplate">
                <div class="table-header">
                    <div class="tournament-name" contenteditable="true" data-placeholder="TOURNAMENT NAME">TOURNAMENT NAME</div>
                    <div class="logo" style="font-size:14px;">BGHQ</div>
                    <div class="date-field" contenteditable="true" data-placeholder="DATE">DATE: 15/03/2026</div>
                </div>
                <table class="point-table">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th style="text-align:left;">TEAM NAME</th>
                            <th>MP</th>
                            <th>PP</th>
                            <th>KP</th>
                            <th>TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>

        <!-- ═══════════════ RIGHT TOOLBAR ═══════════════ -->
        <aside class="toolbar">
            <div class="tool-icon" title="Layers" id="toolLayers">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="tool-icon" title="Color Palette" id="toolPalette">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.39 2.3-1.03a1.5 1.5 0 0 0-.25-2.2l-.63-.78A1.94 1.94 0 0 1 13 17.5a1.5 1.5 0 0 1 1.5-1.5c.34 0 .68.1 1.05.28a4 4 0 0 0 4.15-.49C21.05 14.7 22 13.43 22 12c0-5.5-4.5-10-10-10z"/></svg>
            </div>
            <div class="tool-icon" title="Gradient" id="toolGradient">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
            </div>
            <div class="tool-icon" title="Move" id="toolMove">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
            </div>
            <div class="tool-icon active" title="Select" id="toolSelect">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
            </div>
        </aside>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="app.js"></script>
    <script>
        // ── Build 12 table rows ─────────────────────────────────────────────
        (function buildRows() {
            const tbody = document.getElementById('tableBody');
            for (let i = 1; i <= 12; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="rank-cell">${i}</td>
                    <td contenteditable="true" style="text-align:left;" class="name-cell">TEAM ${i}</td>
                    <td contenteditable="true" class="data-cell">0</td>
                    <td contenteditable="true" class="data-cell">0</td>
                    <td contenteditable="true" class="data-cell">0</td>
                    <td contenteditable="true" class="total-cell">0</td>`;
                tbody.appendChild(tr);
            }
            // auto-sort on input
            tbody.addEventListener('input', () => {
                autoCalcTotal();
                autoSortTable();
            });
        })();

        // ── Auto-Calc Total & Sort ──────────────────────────────────────────
        function autoCalcTotal() {
            document.querySelectorAll('#tableBody tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                const pp = parseInt(cells[3]?.innerText) || 0;
                const kp = parseInt(cells[4]?.innerText) || 0;
                const total = pp + kp;
                cells[5].innerText = total;
            });
        }

        function autoSortTable() {
            const tbody = document.getElementById('tableBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            rows.sort((a, b) => {
                const aTotal = parseInt(a.querySelectorAll('td')[5]?.innerText) || 0;
                const bTotal = parseInt(b.querySelectorAll('td')[5]?.innerText) || 0;
                return bTotal - aTotal;
            });
            rows.forEach((row, idx) => {
                row.querySelectorAll('td')[0].innerText = idx + 1;
                tbody.appendChild(row);
            });
        }

        // ── Profile Dropdown ────────────────────────────────────────────────
        const profileBtn  = document.getElementById('profileBtn');
        const profileWrap = document.getElementById('profileWrap');

        profileBtn.addEventListener('click', () => {
            profileWrap.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!profileWrap.contains(e.target)) profileWrap.classList.remove('open');
        });

        // Render days colour
        (function renderDays() {
            const daysEl = document.getElementById('ddDays');
            const days = 28; // static demo value
            daysEl.textContent = `${days} Days Left`;
            daysEl.className = 'profile-days ' + (days > 7 ? 'days-good' : days >= 3 ? 'days-warn' : 'days-danger');
        })();

        // ── Import Dropdown Toggle ───────────────────────────────────────────
        document.getElementById('importToggleBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('importDropdown').classList.toggle('active');
        });

        document.getElementById('localImportBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
            document.getElementById('importDropdown').classList.remove('active');
        });

        document.getElementById('driveToggleBtn').addEventListener('click', () => {
            document.getElementById('driveInputWrap').classList.toggle('open');
            document.getElementById('importDropdown').classList.remove('active');
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('importDropdown').contains(e.target))
                document.getElementById('importDropdown').classList.remove('active');
        });

        // ── Google Drive Fetch ───────────────────────────────────────────────
        document.getElementById('driveFetchBtn').addEventListener('click', () => {
            const raw = document.getElementById('driveUrl').value.trim();
            if (!raw) return showToast('Paste a Drive link first', 'error');
            // Extract file ID from share link
            const match = raw.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (!match) return showToast('Invalid Drive link', 'error');
            const fileId = match[1];
            const directUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
            addThumbToPreview(directUrl);
            document.getElementById('driveUrl').value = '';
            document.getElementById('driveInputWrap').classList.remove('open');
            showToast('Drive image added!', 'success');
        });

        // ── File Input ──────────────────────────────────────────────────────
        document.getElementById('fileInput').addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => addThumbToPreview(ev.target.result);
                reader.readAsDataURL(file);
            });
            this.value = '';
        });

        // ── Thumbnail Preview ────────────────────────────────────────────────
        function addThumbToPreview(src) {
            const preview = document.getElementById('assetPreview');
            const wrap = document.createElement('div');
            wrap.className = 'asset-thumb-wrap';

            const img = document.createElement('img');
            img.src = src;
            img.className = 'asset-thumb';
            img.title = 'Click to place on canvas';
            img.addEventListener('click', () => placeAssetOnCanvas(src));

            const del = document.createElement('button');
            del.className = 'asset-thumb-del';
            del.innerHTML = '×';
            del.title = 'Remove';
            del.addEventListener('click', (e) => { e.stopPropagation(); wrap.remove(); });

            wrap.appendChild(img);
            wrap.appendChild(del);
            preview.appendChild(wrap);
        }

        // ── Place Asset on Canvas ────────────────────────────────────────────
        function placeAssetOnCanvas(src) {
            const canvas = document.getElementById('canvasArea');
            const img = document.createElement('img');
            img.src = src;
            img.style.cssText = 'position:absolute;width:100px;cursor:move;z-index:10;user-select:none;';
            img.style.left = '50px';
            img.style.top  = '50px';

            // Drag logic
            img.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const startX = e.clientX - img.offsetLeft;
                const startY = e.clientY - img.offsetTop;
                const onMove = (ev) => {
                    img.style.left = (ev.clientX - startX) + 'px';
                    img.style.top  = (ev.clientY - startY) + 'px';
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            img.ondragstart = () => false;
            canvas.appendChild(img);
        }

        // ── Download PNG (subscription-aware watermark) ──────────────────────
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const template = document.getElementById('mainTableTemplate');
            showToast('Generating PNG…', 'info');

            // Determine if user is free-tier (window.__userTier set by Supabase module below)
            const isFree = (window.__userTier || 'free') === 'free';

            // Temporarily add watermark overlay for free-tier users before rendering
            let wm = null;
            if (isFree) {
                wm = document.createElement('div');
                wm.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-family:Orbitron,sans-serif;font-size:36px;font-weight:900;color:rgba(255,0,60,0.22);white-space:nowrap;pointer-events:none;z-index:99;text-shadow:0 0 20px rgba(255,0,60,0.3);letter-spacing:3px;text-transform:uppercase;text-align:center;line-height:1.5;width:100%;';
                wm.textContent = 'BGHQ TRIAL — NOT FOR DOWNLOAD';
                template.appendChild(wm);
            }

            try {
                const rendered = await html2canvas(template, {
                    backgroundColor: '#050508',
                    scale: 2,
                    useCORS: true,
                    allowTaint: true
                });

                // Remove temporary watermark
                if (wm) wm.remove();

                const link = document.createElement('a');
                link.download = `BGHQ_PointTable_${Date.now()}.png`;
                link.href = rendered.toDataURL('image/png');
                link.click();

                showToast('Downloaded! Table cleared.', 'success');

                // Silently wipe cells
                document.querySelectorAll('#tableBody td[contenteditable="true"]').forEach((td, i) => {
                    td.innerText = td.classList.contains('name-cell') ? `TEAM ${Math.floor(i/4)+1}` : '0';
                });
                document.querySelector('.tournament-name').innerText = 'TOURNAMENT NAME';
            } catch (err) {
                if (wm) wm.remove();
                showToast('Download failed. Try again.', 'error');
                console.error(err);
            }
        });

        // ── Toolbar active state ─────────────────────────────────────────────
        document.querySelectorAll('.tool-icon').forEach(icon => {
            icon.addEventListener('click', () => {
                document.querySelectorAll('.tool-icon').forEach(i => i.classList.remove('active'));
                icon.classList.add('active');
            });
        });
    </script>

    <!-- ── Supabase Session Guard + Profile Module ─────────────────────────── -->
    <script type="module">
        import { supabase, getCurrentUserProfile, computeDaysLeft, daysLeftClass } from './supabase-config.js';

        // 1. Session guard — redirect to login if not authenticated
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
        }

        // 2. Load profile and populate dropdown
        if (session) {
            const profile = await getCurrentUserProfile();

            if (profile) {
                // Expose tier for download watermark logic
                window.__userTier = profile.subscription_type || 'free';

                document.getElementById('ddUsername').textContent = profile.username || session.user.email;
                document.getElementById('ddSubType').textContent  = profile.subscription_type || 'Free';

                const days = computeDaysLeft(profile.subscription_end);
                const daysEl = document.getElementById('ddDays');
                daysEl.textContent = `${days} Days Left`;
                daysEl.className   = `profile-days ${daysLeftClass(days)}`;
            } else {
                window.__userTier = 'free';
            }
        }

        // 3. Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });
    </script>

    <!-- =====================================================================
    // VERSION 2: AI Screenshot Parser
    // Tesseract.js OCR reads FF match result screenshot, auto-fills table cells
    // with team name, kills, placement
    // =====================================================================

    // VERSION 2: Multiple table templates
    // User picks from 3 BGHQ style templates before editing

    // VERSION 3: Team collaboration
    // Shareable session code, WebSocket live sync, session deletes on download

    // VERSION 3: BGMI mode
    // Separate column set for BGMI tournaments (different placement/kill scoring)
    ===================================================================== -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BGHQ Point Table</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav>
        <div class="logo">BGHQ</div>
        <div class="nav-right">
            <div class="dropdown">
                <div class="profile-icon" id="userProfileBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="dropdown-content neon-border-blue" style="right: 0; width: 200px; padding: 15px;">
                    <div style="font-size: 14px; margin-bottom: 5px;">User: <span class="neon-text-blue" id="displayUsername">Player01</span></div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">Sub: <span class="neon-text-green">28 Days Left</span></div>
                    <a href="index.html" class="btn btn-blue" style="width: 100%; padding: 5px; font-size: 10px;">LOGOUT</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-block">
                <span class="label-small">Assets</span>
                <div class="dropdown">
                    <button class="btn btn-blue" style="width: 100%; font-size: 10px; padding: 8px;">IMPORT IMAGE</button>
                    <div class="dropdown-content neon-border-blue">
                        <div class="dropdown-item" onclick="document.getElementById('fileInput').click()">Local Storage</div>
                        <div class="dropdown-item" onclick="prompt('Paste Google Drive Link:')">Google Drive Link</div>
                    </div>
                </div>
                <input type="file" id="fileInput" style="display: none;" accept="image/*">
            </div>

            <div class="sidebar-block">
                <span class="label-small">Preview / Place</span>
                <div class="asset-preview" id="assetPreview">
                    <!-- Thumbs will appear here -->
                </div>
            </div>

            <div class="sidebar-block">
                <span class="label-small">Workflow</span>
                <button class="btn btn-green" style="width: 100%; font-size: 10px; padding: 8px; margin-bottom: 5px;" onclick="saveMacro()">CREATE MACRO</button>
                <button class="btn btn-blue" style="width: 100%; font-size: 10px; padding: 8px;" onclick="applyMacro()">APPLY MACRO</button>
            </div>

            <div style="margin-top: auto;">
                <button class="btn btn-pink" id="downloadBtn" style="width: 100%; border: 2px solid var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink);">DOWNLOAD PNG</button>
            </div>
        </aside>

        <!-- Center Canvas -->
        <main class="main-canvas-area" id="canvasArea">
            <div class="point-table-template" id="mainTableTemplate">
                <div class="table-header">
                    <div class="tournament-name" contenteditable="true">TOURNAMENT NAME</div>
                    <div class="logo" style="font-size: 14px;">BGHQ</div>
                    <div class="date-field" contenteditable="true">DATE: 01/01/2026</div>
                </div>
                <table class="point-table">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th style="text-align: left;">TEAM NAME</th>
                            <th>MP</th>
                            <th>PP</th>
                            <th>KP</th>
                            <th>TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 12 Rows -->
                        <script>
                            for(let i=1; i<=12; i++) {
                                document.write(`
                                    <tr>
                                        <td>${i}</td>
                                        <td contenteditable="true" style="text-align: left;">TEAM ${i}</td>
                                        <td contenteditable="true">0</td>
                                        <td contenteditable="true">0</td>
                                        <td contenteditable="true">0</td>
                                        <td contenteditable="true">0</td>
                                    </tr>
                                `);
                            }
                        </script>
                    </tbody>
                </table>
            </div>
        </main>

        <!-- Right Toolbar -->
        <aside class="toolbar">
            <div class="tool-icon" title="Layers">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="12" width="20" height="8" rx="2"/><path d="M7 2h10l5 5v13a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7l5-5z"/><path d="M7 2v5h5"/></svg>
            </div>
            <div class="tool-icon" title="Palette">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.39 2.3-1.03.35-.37.38-.93.22-1.42a1.45 1.45 0 0 0-.25-.38l-.63-.78A1.94 1.94 0 0 1 13 17.5a1.5 1.5 0 0 1 1.5-1.5c.34 0 .68.1 1.05.28a4 4 0 0 0 4.15-.49C21.05 14.7 22 13.43 22 12c0-5.5-4.5-10-10-10z"/></svg>
            </div>
            <div class="tool-icon" title="Gradients">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="tool-icon" title="Move Tool">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
            </div>
            <div class="tool-icon active" title="Select Tool">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
            </div>
        </aside>
    </div>

    <!-- Toast Container -->
    <div id="toast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--neon-pink); color: #fff; padding: 10px 20px; border-radius: 5px; display: none; z-index: 1000; font-family: 'Orbitron'; font-size: 12px; box-shadow: 0 0 20px rgba(255, 0, 60, 0.5);">No Macro Saved!</div>

    <script src="app.js"></script>
</body>
</html>
